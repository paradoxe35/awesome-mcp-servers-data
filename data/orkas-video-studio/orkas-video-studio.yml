markdown: |
  ## Overview

  MIT-licensed, local-first TypeScript CLI and MCP toolkit for composing and editing videos from editable plan.json timelines.

  Build from source, then register `node /path/to/Orkas-VideoStudio/packages/mcp/dist/index.js` as a stdio MCP server. Composition and editing use local tools; optional provider-backed generation uses the user's own keys.
